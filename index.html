<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Nurse Office - Medical Certificate Issuance System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Clinic Management Office</h2>
            <p class="text-muted">Automated Medical Certificate Generation System</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- CARD 1: PATIENT LOOKUP -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">1. Patient Lookup</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" id="searchStudentId" class="form-control" placeholder="Enter Student / Employee ID (e.g. 22-12345)">
                            <button class="btn btn-outline-primary" type="button" onclick="searchPatient()">Search Patient</button>
                        </div>
                        <div id="patientStatus" class="form-text text-danger"></div>
                    </div>
                </div>

                <!-- CARD 2: MEDICAL CERTIFICATE FORM -->
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">2. Medical Certificate Details</h5>
                    </div>
                    <div class="card-body">
                        <form id="medCertForm" onsubmit="issueMedicalCertificate(event)">
                            
                            <!-- Hidden Patient ID -->
                            <input type="hidden" id="patientId">

                            <!-- Read-only Patient Details -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Patient Full Name</label>
                                <input type="text" id="fullName" class="form-control" readonly placeholder="Auto-populated after search">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Department / Course</label>
                                <input type="text" id="department" class="form-control" readonly placeholder="Auto-populated after search">
                            </div>

                            <hr>

                            <!-- Med Cert Inputs -->
                            <div class="mb-3">
                                <label for="diagnosis" class="form-label fw-bold">Diagnosis / Findings <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="diagnosis" rows="3" required placeholder="Enter medical diagnosis..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="fitStatus" class="form-label fw-bold">Fitness Status</label>
                                <select class="form-select" id="fitStatus">
                                    <option value="Fit to return to class / work">Fit to return to class / work</option>
                                    <option value="Unfit for class / work (Needs rest)">Unfit for class / work (Needs rest)</option>
                                    <option value="Cleared with restriction">Cleared with restriction</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="recommendations" class="form-label fw-bold">Recommendations / Remarks</label>
                                <textarea class="form-control" id="recommendations" rows="2" placeholder="e.g., Needs 2 days of strict bed rest"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="issuedBy" class="form-label fw-bold">Attending Nurse / Physician <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="issuedBy" required placeholder="Enter Nurse Name & License No.">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Generate & Issue Medical Certificate</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FRONTEND JAVASCRIPT LOGIC -->
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        // 1. Function para maghanap ng pasyente gamit ang Student/Employee ID
        async function searchPatient() {
            const studentId = document.getElementById('searchStudentId').value.trim();
            const statusDiv = document.getElementById('patientStatus');

            if (!studentId) {
                statusDiv.textContent = "Please enter a valid ID.";
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/patients/search-id?studentId=${studentId}`);
                
                if (!response.ok) {
                    throw new Error('Patient not found in the database.');
                }

                const patient = await response.json();
                
                // I-populate ang form fields
                document.getElementById('patientId').value = patient.id;
                document.getElementById('fullName').value = `${patient.lastName}, ${patient.firstName}`;
                document.getElementById('department').value = patient.departmentCourse || 'N/A';
                statusDiv.textContent = ""; // Clear error

            } catch (error) {
                statusDiv.textContent = "Patient not found. Please check the ID or register the patient first.";
                document.getElementById('patientId').value = "";
                document.getElementById('fullName').value = "";
                document.getElementById('department').value = "";
            }
        }

        // 2. Function para i-submit ang Med Cert form at i-trigger ang PDF download
        async function issueMedicalCertificate(event) {
            event.preventDefault();

            const patientId = document.getElementById('patientId').value;

            if (!patientId) {
                alert('Please search and select a valid patient first!');
                return;
            }

            const medCertData = {
                diagnosis: document.getElementById('diagnosis').value,
                fitStatus: document.getElementById('fitStatus').value,
                recommendations: document.getElementById('recommendations').value,
                issuedBy: document.getElementById('issuedBy').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/certificates/issue/${patientId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(medCertData)
                });

                if (!response.ok) {
                    throw new Error('Failed to issue medical certificate.');
                }

                const result = await response.json();
                alert(`Success! Medical Certificate No: ${result.certificateNumber} has been generated.`);

                // 3. Automatic na i-download ang PDF gamit ang ID ng certificate
                window.open(`${API_BASE_URL}/certificates/download/${result.id}`, '_blank');

                // I-reset ang form pagkatapos
                document.getElementById('medCertForm').reset();
                document.getElementById('patientId').value = "";

            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
